# Runs the tests on push and pull request. Nothing here publishes anything.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v6

      - name: Install the package, pandas extra and pytest
        run: python -m pip install ".[pandas]" pytest

      # Public FDA/EMA/ICH samples and the ICH XSD set are not committed, so
      # they are downloaded here. fda.gov blocks scripted downloads, so the FDA
      # and ICH sources are usually missing on CI; tests that need them skip.
      # The full suite (all samples and golden values) runs locally.
      - name: Fetch fixtures and schemas (best effort)
        run: python scripts/fetch_fixtures.py --allow-missing

      # Build locally so tests/test_wheel.py can check the wheel and sdist
      # hold no fixtures, schemas or dictionary files. Not uploaded anywhere.
      - name: Build wheel and sdist
        run: uv build

      - name: Run tests
        run: python -m pytest -ra
